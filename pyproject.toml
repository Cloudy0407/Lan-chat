[project]
name = "lan-chat"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: PEP 8, F: lỗi logic (biến không dùng, import thừa...), I: thứ tự import,
# N: quy ước đặt tên, B: lỗi hay gặp (ví dụ except trống), UP: cú pháp Python mới
select = ["E", "W", "F", "I", "N", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
